services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: wagering
    ports: ["5432:5432"]
    volumes:
      # Cria também o banco `wagering_test` (só roda quando o volume é novo).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  ministack:
    # Versão fixa: emulador SQS gratuito, sem conta/token (o LocalStack atual exige token).
    image: ministackorg/ministack:1.5.43
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports: ["4566:4566"]
    volumes:
      - ./ministack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      # "Saudável" só depois que o script de init criou a última fila.
      test: ["CMD", "aws", "--endpoint-url", "http://localhost:4566", "sqs", "get-queue-url", "--queue-name", "wallet-events.fifo"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://app:app@postgres:5432/wagering
      SQS_ENDPOINT: http://ministack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      ministack: { condition: service_healthy }
    # `exec`: o bun SUBSTITUI o sh e vira o PID 1. Sem isso o SIGTERM do `docker stop` ia para o sh,
    # que não repassa o sinal — o app nunca desligava limpo e era morto à força (exit 137).
    command: ["sh", "-c", "bun scripts/migrate.ts up && exec bun src/main.ts"]
    # Prazo entre o SIGTERM e o SIGKILL. Explícito (o padrão variou entre versões; aqui deu 3s): o consumidor
    # espera o long polling em curso (até 5s) para devolver mensagens em vez de deixá-las escondidas por 30s.
    stop_grace_period: 15s
